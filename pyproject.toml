[project]
name = "conv-docs"
version = "0.1.0"
description = "conv-docs (Convenient Documents) — a read-only document gateway: serve explicitly published workspace docs securely to your phone"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Han-Qing Shi", email = "hanqshih@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
keywords = ["docs", "markdown", "readonly", "self-hosted", "cloudflare-tunnel"]
# Zero third-party runtime dependencies: the server uses only the Python standard library
dependencies = []

[project.urls]
Homepage = "https://github.com/M1racleShih/conv-docs"
Repository = "https://github.com/M1racleShih/conv-docs"
Issues = "https://github.com/M1racleShih/conv-docs/issues"

[project.scripts]
conv-docs = "conv_docs.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conv_docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
