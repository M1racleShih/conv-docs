[project]
name = "conv-doc"
version = "0.1.0"
description = "conv-doc (Convenient Documents) — 只读文档网关：把显式发布的 workspace 目录安全地送到手机端渲染阅读"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["docs", "markdown", "readonly", "self-hosted", "cloudflare-tunnel"]
# 运行时零第三方依赖：服务端只用 Python 标准库
dependencies = []

[project.scripts]
conv-doc = "conv_doc.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conv_doc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
